name: APK Olustur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle assembleRelease --no-daemon

      - name: APK adini duzenle
        run: cp app/build/outputs/apk/release/app-release.apk Bzk_Kilit_Ekrani_v1.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bzk_Kilit_Ekrani_APK
          path: Bzk_Kilit_Ekrani_v1.0.apk
