plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yhan.kilitekrani'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yhan.kilitekrani'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        yhan {
            storeFile file('yhan.jks')
            storePassword 'yhan2026'
            keyAlias 'yhan'
            keyPassword 'yhan2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.yhan
        }
        debug {
            signingConfig signingConfigs.yhan
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
