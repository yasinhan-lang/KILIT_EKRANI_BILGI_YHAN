name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Bu satır, butona basarak manuel derleme yapmanızı sağlar.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodları İndir
      uses: actions/checkout@v4

    - name: Java JDK Kur
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17' # Projenizin gerektirdiği Java sürümü (genelde 11 veya 17)

    - name: Gradle İzinlerini Ver
      run: chmod +x gradlew

    - name: APK Derle (Debug)
      run: ./gradlew assembleDebug
      # Eğer Release (imzalı) sürüm istiyorsanız yukarıdaki satırı şu şekilde değiştirin:
      # run: ./gradlew assembleRelease

    - name: APK'yı Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Derlenmis-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        # Release derlediyseniz yolu şu yapın: app/build/outputs/apk/release/app-release-unsigned.apk
